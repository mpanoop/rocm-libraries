#
# Simple Mixed Precision F32→F16→F32 GEMM Test
#
# Minimal configuration for quick testing of F32 input/output with F16 compute
#

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102]

GlobalParameters:
  PrintLevel: 1
  NumElementsToValidate: -1
  ValidationPrintValids: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  KernelTime: True

BenchmarkProblems:

  - # Mixed F32→F16→F32 GEMM NN (simple)
    - # ProblemType
      OperationType: GEMM
      DataType: s           # F32 input
      MacDataTypeA: h       # F16 compute
      MacDataTypeB: h       # F16 compute
      DestDataType: s       # F32 output
      ComputeDataType: s    # F32 accumulation
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # Benchmark Configuration
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Enable F32→F16 conversion
        - ConvertF32toF16A: [True]
        - ConvertF32toF16B: [True]

        # Basic configuration
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 2, 2, 2, 2]
        - GlobalReadVectorWidthA: [4]
        - GlobalReadVectorWidthB: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - DepthU: [32]
        - WorkGroup: [[32, 8, 1]]
        - BufferLoad: [True]
        - BufferStore: [True]

      BenchmarkFinalParameters:
        - ProblemSizes:
          # Quick test sizes
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
